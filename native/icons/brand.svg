<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Menu-bar glyph (R1 Calm Arc, as adopted 2026-10-16). Template-ready: black + alpha only. 24 grid,
       1.6 stroke, round caps. Two parts and one dot. The composer (radius 3.8) is left open along its
       top-left; one uniform arc drops in through that opening, clear of the left wall so it reads as
       arriving rather than as the wall's continuation, flattens onto the line of text and ends in a round
       head (r 1.75) at the line's end: the landing point. -->
  <path d="M9.4 6.2H18a3.8 3.8 0 0 1 3.8 3.8v4.4a3.8 3.8 0 0 1-3.8 3.8H6a3.8 3.8 0 0 1-3.8-3.8V10.6" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M5.2 2.4Q6.4 13.6 11.8 13.6H15.2" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="16.6" cy="13.6" r="1.75" fill="#000"/>
</svg>
