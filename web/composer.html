<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Local test composer</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/composer.js"></script>
  </head>
  <body>
    <main class="composer-shell">
      <header class="composer-header">
        <div>
          <span class="eyebrow-label">CONTROLLED TEST COMPOSER</span>
          <h1 id="composer-title">Field notes</h1>
          <p>A local draft for testing. No agent, account, or sending.</p>
        </div>
        <div class="composer-identity">
          <span id="composer-state" class="composer-state">Connecting…</span
          ><span id="window-identity" class="subtle"></span>
        </div>
      </header>
      <label for="editor">Current conversation draft</label
      ><textarea
        id="editor"
        placeholder="Start a draft, then add your selected conversation…"
        spellcheck="false"
      ></textarea>
      <div id="composer-files" class="composer-files" aria-live="polite"></div>
      <div class="composer-tools">
        <label><input id="receiving" type="checkbox" checked /> Accept additions</label
        ><label><input id="fail-next" type="checkbox" /> Fail next addition</label
        ><label><input id="hold-next" type="checkbox" /> Hold next addition</label>
      </div>
      <button id="new-conversation" class="secondary">Switch conversation</button>
      <p id="composer-status" class="notice" role="status" aria-live="polite" hidden></p>
      <p class="test-note">
        Additions preserve the draft by default. Successful receipts verify the exact text and file
        bytes in this composer. Switching conversations invalidates an earlier target selection.
      </p>
    </main>
  </body>
</html>
