       in a round head (r 1.75) at the line's end: the head is the landing point and replaces the caret. -->
  <path d="M7.8 6.2H18a3.8 3.8 0 0 1 3.8 3.8v4.4a3.8 3.8 0 0 1-3.8 3.8H6a3.8 3.8 0 0 1-3.8-3.8V10.6" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M2.6 3.6Q5.4 13.6 11.8 13.6H15.2" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="16.6" cy="13.6" r="1.75" fill="#000"/>
