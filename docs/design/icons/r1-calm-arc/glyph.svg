<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- R1 Calm Arc, menu-bar glyph. Template-ready: black + alpha only. 24 grid, 1.6 stroke, round caps.
       Two parts and one dot. The composer (radius 3.8) is left open at its top-left corner. One uniform arc
