<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Handoff</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <!-- 24-grid, 1.5 stroke, round caps (Praxis marks). preview and save are drawn here in the same grammar. -->
    <svg class="sprite" aria-hidden="true">
      <defs>
        <symbol id="g-chat" viewBox="0 0 24 24">
          <path
            d="M6 4.5h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6.5L8 20v-3.5H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"
          />
          <path d="M8 9h8M8 12.5h5" />
        </symbol>
        <symbol id="g-agent" viewBox="0 0 24 24">
          <rect x="5" y="8" width="14" height="11.5" rx="3" />
          <path d="M12 8V5.5M9.5 12.75v1.75M14.5 12.75v1.75" />
          <circle cx="12" cy="4.25" r="1.25" />
        </symbol>
        <symbol id="g-inject" viewBox="0 0 24 24">
          <path d="M13 5h5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5M3 12h11.5M11 8.5l3.5 3.5-3.5 3.5" />
        </symbol>
        <symbol id="g-retry" viewBox="0 0 24 24">
          <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M17.6 2.9v4h-4" />
        </symbol>
        <symbol id="g-lock" viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="9.5" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3M12 15v1.75" />
        </symbol>
        <symbol id="g-rejected" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M9 9l6 6M15 9l-6 6" />
        </symbol>
        <symbol id="g-done" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M8 12.3l2.8 2.8L16 9.5" />
        </symbol>
        <symbol id="g-unverified" viewBox="0 0 24 24">
          <path d="M2.5 12h8" />
          <circle cx="15.5" cy="12" r="5" />
        </symbol>
        <symbol id="g-running" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <circle cx="8" cy="12" r="1.1" class="dot" />
          <circle cx="12" cy="12" r="1.1" class="dot" />
          <circle cx="16" cy="12" r="1.1" class="dot" />
        </symbol>
        <symbol id="g-preview" viewBox="0 0 24 24">
          <path d="M2.75 12S6 5.75 12 5.75 21.25 12 21.25 12 18 18.25 12 18.25 2.75 12 2.75 12z" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="g-save" viewBox="0 0 24 24">
          <path
            d="M12 3.5v11M7.75 10.5 12 14.75l4.25-4.25M4.5 15.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2"
          />
        </symbol>
      </defs>
    </svg>

    <header>
      <strong>Handoff</strong>
      <span class="tag" title="Handoff adds text to a draft. You send it yourself.">
        <svg class="g"><use href="#g-lock" /></svg>Never sends
      </span>
    </header>

    <main>
      <section class="source" aria-label="Conversation">
        <svg class="g lead"><use href="#g-chat" /></svg>
        <div class="grow">
          <p id="source" role="status">Preparing this chat…</p>
          <span id="verify" class="tag" hidden></span>
        </div>
        <button
          id="preview"
          class="icon"
          aria-label="Preview context"
          title="Preview context"
          aria-pressed="false"
          disabled
        >
          <svg class="g"><use href="#g-preview" /></svg>
        </button>
        <button id="save" class="icon" aria-label="Save Markdown" title="Save Markdown" disabled>
          <svg class="g"><use href="#g-save" /></svg>
        </button>
      </section>

      <button id="enable" class="btn wide">
        <svg class="g"><use href="#g-lock" /></svg>Allow this chat
      </button>
      <p id="help" class="note">Keeps your Chrome login. Reads only this chat as it loads.</p>

      <section id="preview-area" hidden>
        <label for="text" class="visually-hidden">Prepared context</label>
        <textarea id="text" readonly spellcheck="false"></textarea>
      </section>

      <div class="target">
        <svg class="g lead"><use href="#g-agent" /></svg>
        <label id="target-label" class="grow">
          <span class="visually-hidden">Composer window</span>
          <select id="target">
            <option value="">Choose composer…</option>
          </select>
        </label>
        <button id="targets" class="icon" aria-label="Find open windows" title="Find open windows">
          <svg class="g"><use href="#g-retry" /></svg>
        </button>
      </div>
      <button id="access" class="btn wide" hidden>
        <svg class="g"><use href="#g-lock" /></svg>Allow Accessibility…
      </button>

      <div class="act">
        <button id="add" class="btn primary" disabled>
          <svg class="g"><use href="#g-inject" /></svg><span id="add-label">Add to Agent</span>
        </button>
        <button id="cancel" class="icon" aria-label="Cancel" title="Cancel" hidden>
          <svg class="g"><use href="#g-rejected" /></svg>
        </button>
      </div>

      <p class="status">
        <svg class="g busy" aria-hidden="true"><use href="#g-running" /></svg
        ><span id="status" role="status" aria-live="polite"></span>
      </p>

      <details>
        <summary>More</summary>
        <p id="setup" class="note">
          Install the native helper from the Handoff app to reach composers in other macOS apps.
        </p>
        <a href="popup.html">Export and rendered-source tools</a>
      </details>
    </main>
    <script type="module" src="chat.js"></script>
  </body>
</html>
